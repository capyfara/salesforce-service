services:
  db:
    image: postgres:16-alpine
    container_name: salesforce-service-db-dev
    environment:
      POSTGRES_DB: salesforce_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
    ports:
      - "5432:5432"
    volumes:
      - salesforce_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d salesforce_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: salesforce-service-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - salesforce_dev_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job: creates the salesforce-dev bucket on startup.
  # Nothing else in the stack provisions this bucket automatically.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: salesforce-service-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/salesforce-dev
      "
    restart: "no"

volumes:
  salesforce_dev_pgdata:
  salesforce_dev_miniodata:
